<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<title>Offline</title>
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaed; text-align: center; padding: 24px; }
			@media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #14161a; } }
			h1 { margin: 0 0 8px; } p { margin: 0 0 20px; opacity: .7; }
			button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: 0; background: #34d399; color: #04130d; }
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>Expenses need a connection to load and save.</p>
			<button onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
